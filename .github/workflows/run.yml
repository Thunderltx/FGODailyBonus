name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: python -m pip install -r requirements.txt
    - name: Verify runtime and RSA signing
      run: |
        python - <<'PY'
        import base64
        import sys
        import cryptography
        import requests
        from cryptography.hazmat.backends import default_backend
        from cryptography.hazmat.primitives import hashes
        from cryptography.hazmat.primitives.asymmetric import padding
        from rsa import loaded_private_key, sign

        print(f'Python: {sys.version}')
        print(f'cryptography: {cryptography.__version__}')
        print(f'requests: {requests.__version__}')
        print(f'OpenSSL: {default_backend().openssl_version_text()}')
        message = 'FGODailyBonus compatibility check'
        signature = base64.b64decode(sign(message))
        loaded_private_key.public_key().verify(
            signature, message.encode('utf-8'), padding.PKCS1v15(), hashes.SHA256()
        )
        print('RSA signing check passed')
        PY
    - name: Daily check-in
      run: python main.py
      env:
        userIds: ${{ secrets.GAME_USERIDS }}
        authKeys: ${{ secrets.GAME_AUTHKEYS }}
        secretKeys: ${{ secrets.GAME_SECRETKEYS }}
        verCode: ${{ secrets.GAME_VERCODE }}
        UserAgent: ${{ secrets.GAME_USERAGENT }}
        TGBotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TGAdminId: ${{ secrets.TELEGRAM_ADMIN_ID }}
        GithubToken: ${{ secrets.VERY_IMPORTANT_TOKEN }}
        GithubName: ${{ secrets.VERY_IMPORTANT_NAME }}
